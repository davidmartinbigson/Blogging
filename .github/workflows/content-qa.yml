name: Content QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Content & SEO audit
        run: npm run seo:check

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sageandstory.com
